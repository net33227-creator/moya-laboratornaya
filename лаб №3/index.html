<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="header">
        <div class="container header__container">
            <div class="logo">TechStore</div>
            <nav class="nav">
                <a href="#">Главная</a>
                <a href="#">Товары</a>
                <a href="#">О нас</a>
                <a href="#">Контакты</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container hero__container">
            <div class="hero__content">
                <h1 class="hero__title">Надёжный ноутбук для учёбы и работы</h1>
                <p class="hero__text">Мощный, стильный и удобный ноутбук для студентов, программистов и всех, кто ценит качество. Быстрая доставка и гарантия.</p>
                <a href="#" class="btn btn--primary">Купить сейчас →</a>
            </div>
            
            <div class="product-card">
                <div class="product-card__image">
                    <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=600&q=80" alt="Ноутбук">
                </div>
                <div class="product-card__content">
                    <h3 class="product-card__title">Pro Notebook X</h3>
                    <p class="product-card__price">49 990 сом</p>
                    <button class="product-card__button">В корзину</button>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
